# Free PR checks for apps/api on GitHub-hosted runners (no secrets, no
# services). The upstream workflows use paid Blacksmith runners.
name: PR checks / api

on:
  pull_request:
    branches:
      - main
    paths:
      - apps/api/**
      - .github/workflows/pr-checks-api.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Typecheck, knip, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml

      # Install without lifecycle scripts so native addons such as foundationdb
      # are not compiled; only the Rust module is built, in the step below.
      - name: Install API dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: apps/api
        env:
          npm_config_ignore_scripts: "true"

      - name: Restore native lib
        id: napi_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/api/native/*.node
            apps/api/native/index.js
            apps/api/native/index.d.ts
          key: ${{ runner.os }}-napi-${{ hashFiles('apps/api/native/Cargo.toml', 'apps/api/native/package.json', 'apps/api/native/src/**') }}

      - name: Build native lib
        if: steps.napi_restore.outputs.cache-hit != 'true'
        run: pnpm run build
        working-directory: apps/api/native

      - name: Cache native lib
        if: steps.napi_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            apps/api/native/*.node
            apps/api/native/index.js
            apps/api/native/index.d.ts
          key: ${{ steps.napi_restore.outputs.cache-primary-key }}

      - name: Typecheck
        run: pnpm exec tsc --noEmit
        working-directory: apps/api

      - name: knip
        run: pnpm knip
        working-directory: apps/api

      - name: Unit tests
        run: >-
          pnpm exec vitest run
          src/__tests__/snips/v1/types-validation.test.ts
          src/__tests__/snips/v2/types-validation.test.ts
          src/__tests__/lib/search-query-builder.test.ts
          src/services/monitoring/search/run.test.ts
          src/scraper/WebScraper/utils/blocklist.test.ts
          src/lib/siem-logging/event.test.ts
        working-directory: apps/api
