name: firecrawl

x-common-service: &common-service
  # NOTE: If you don't want to build the service locally, comment out the
  # build: statement and change image: to ghcr.io/firecrawl/firecrawl
  image: firecrawl-api
  build: apps/api

  # The api image is distroless (no shell), so each process runs as its own
  # service with an exec-form command instead of being launched by harness.js.
  # The image entrypoint is node, so `command` is just the script path.
  restart: unless-stopped
  depends_on: &common-depends-on
    redis:
      condition: service_started
    rabbitmq:
      condition: service_healthy
    nuq-postgres:
      condition: service_started
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  networks:
    - backend
  extra_hosts:
    - "host.docker.internal:host-gateway"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  volumes:
    - fdb-cluster-file:/var/fdb:ro
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
      compress: "true"

x-common-env: &common-env
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  REDIS_RATE_LIMIT_URL: ${REDIS_RATE_LIMIT_URL:-${REDIS_URL:-redis://redis:6379}}
  PLAYWRIGHT_MICROSERVICE_URL: ${PLAYWRIGHT_MICROSERVICE_URL:-http://playwright-service:3000/scrape}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
  POSTGRES_DB: ${POSTGRES_DB:-postgres}
  POSTGRES_HOST: ${POSTGRES_HOST:-nuq-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  # Built from the POSTGRES_* values above. If your password contains URL
  # special characters (@ : / ? # %), set NUQ_DATABASE_URL yourself with the
  # password percent-encoded.
  NUQ_DATABASE_URL: ${NUQ_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-nuq-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}}
  NUQ_DATABASE_URL_LISTEN: ${NUQ_DATABASE_URL_LISTEN:-${NUQ_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-nuq-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}}}
  NUQ_RABBITMQ_URL: ${NUQ_RABBITMQ_URL:-amqp://rabbitmq:5672}
  ENV: local
  USE_DB_AUTHENTICATION: ${USE_DB_AUTHENTICATION:-false}
  NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE:-8}
  CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS:-10}
  MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-5}
  BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-5}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL}
  MODEL_NAME: ${MODEL_NAME}
  MODEL_EMBEDDING_NAME: ${MODEL_EMBEDDING_NAME}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
  AUTUMN_SECRET_KEY: ${AUTUMN_SECRET_KEY}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
  BULL_AUTH_KEY: ${BULL_AUTH_KEY}
  TEST_API_KEY: ${TEST_API_KEY}
  SUPABASE_ANON_TOKEN: ${SUPABASE_ANON_TOKEN}
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_SERVICE_TOKEN: ${SUPABASE_SERVICE_TOKEN}
  SELF_HOSTED_WEBHOOK_URL: ${SELF_HOSTED_WEBHOOK_URL}
  LOGGING_LEVEL: ${LOGGING_LEVEL}
  PROXY_SERVER: ${PROXY_SERVER}
  PROXY_USERNAME: ${PROXY_USERNAME}
  PROXY_PASSWORD: ${PROXY_PASSWORD}
  SEARXNG_ENDPOINT: ${SEARXNG_ENDPOINT}
  SEARXNG_ENGINES: ${SEARXNG_ENGINES}
  SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES}
  # Set NUQ_BACKEND=fdb to run the queue on FoundationDB instead of Postgres
  NUQ_BACKEND: ${NUQ_BACKEND}
  FDB_CLUSTER_FILE: ${NUQ_BACKEND:+/var/fdb/fdb.cluster}

services:
  playwright-service:
    # NOTE: If you don't want to build the service locally,
    # comment out the build: statement and uncomment the image: statement
    # image: ghcr.io/firecrawl/playwright-service:latest
    build: apps/playwright-service-ts
    environment:
      PORT: 3000
      PROXY_SERVER: ${PROXY_SERVER}
      PROXY_USERNAME: ${PROXY_USERNAME}
      PROXY_PASSWORD: ${PROXY_PASSWORD}
      ALLOW_LOCAL_WEBHOOKS: ${ALLOW_LOCAL_WEBHOOKS}
      BLOCK_MEDIA: ${BLOCK_MEDIA}
      # Configure maximum concurrent pages for Playwright browser instances
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-10}
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Resource limits for Docker Compose (not Swarm)
    cpus: 4.0
    mem_limit: 6G
    memswap_limit: 6G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g

  api:
    <<: *common-service
    environment:
      <<: *common-env
      HOST: "0.0.0.0"
      PORT: ${INTERNAL_PORT:-3002}
      NUQ_POD_NAME: api
    depends_on:
      <<: *common-depends-on
      playwright-service:
        condition: service_started
    ports:
      - "${PORT:-3002}:${INTERNAL_PORT:-3002}"
    command: ["dist/src/index.js"]
    # Resource limits for Docker Compose (not Swarm)
    # Increase if you have more CPU cores/RAM available
    cpus: 2.0
    mem_limit: 2G
    memswap_limit: 2G

  worker:
    <<: *common-service
    environment:
      <<: *common-env
      NUQ_POD_NAME: worker
    depends_on:
      <<: *common-depends-on
      playwright-service:
        condition: service_started
    command: ["dist/src/services/queue-worker.js"]
    cpus: 2.0
    mem_limit: 3G
    memswap_limit: 3G

  extract-worker:
    <<: *common-service
    environment:
      <<: *common-env
      NUQ_POD_NAME: extract-worker
    command: ["dist/src/services/extract-worker.js"]
    cpus: 1.0
    mem_limit: 1G
    memswap_limit: 1G

  # Scrape workers. Runs nuq-fdb-worker instead when NUQ_BACKEND=fdb.
  nuq-worker:
    <<: *common-service
    environment:
      <<: *common-env
      NUQ_POD_NAME: nuq-worker
    depends_on:
      <<: *common-depends-on
      playwright-service:
        condition: service_started
    command: ["dist/src/services/worker/nuq-${NUQ_BACKEND:+fdb-}worker.js"]
    scale: ${NUQ_WORKER_COUNT:-5}
    cpus: 1.0
    mem_limit: 1536M
    memswap_limit: 1536M

  # The prefetch and reconciler workers are only used by the Postgres queue
  # backend; they idle harmlessly when NUQ_BACKEND=fdb.
  nuq-prefetch-worker:
    <<: *common-service
    environment:
      <<: *common-env
      NUQ_POD_NAME: nuq-prefetch-worker-0
      NUQ_PREFETCH_REPLICAS: 1
    command: ["dist/src/services/worker/nuq-prefetch-worker.js"]
    cpus: 0.5
    mem_limit: 512M
    memswap_limit: 512M

  nuq-reconciler:
    <<: *common-service
    environment:
      <<: *common-env
      NUQ_POD_NAME: nuq-reconciler-worker-0
    command: ["dist/src/services/worker/nuq-reconciler-worker.js"]
    cpus: 0.5
    mem_limit: 512M
    memswap_limit: 512M

  # Only needed with USE_DB_AUTHENTICATION=true. Enable with
  # `docker compose --profile db-auth up`.
  index-worker:
    <<: *common-service
    profiles: ["db-auth"]
    environment:
      <<: *common-env
      NUQ_POD_NAME: index-worker
    command: ["dist/src/services/indexing/index-worker.js"]
    cpus: 1.0
    mem_limit: 1G
    memswap_limit: 1G

  redis:
    # NOTE: If you want to use Valkey (open source) instead of Redis (source available),
    # uncomment the Valkey statement and comment out the Redis statement.
    # Using Valkey with Firecrawl is untested and not guaranteed to work. Use with caution.
    image: redis:alpine
    # image: valkey/valkey:alpine

    networks:
      - backend
    command: redis-server --bind 0.0.0.0
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"

  rabbitmq:
    image: rabbitmq:3-management
    networks:
      - backend
    command: rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"

  nuq-postgres:
    # NOTE: If you don't want to build the image locally,
    # comment out the build: statement and uncomment the image: statement
    # image: ghcr.io/firecrawl/nuq-postgres:latest
    build: apps/nuq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # FoundationDB queue backend (experimental). Enable by setting
  # NUQ_BACKEND=fdb; the api container reads the shared cluster file from the
  # fdb-cluster-file volume. Replaces nuq-postgres once stable.
  foundationdb:
    image: foundationdb/foundationdb:7.3.63
    environment:
      FDB_NETWORKING_MODE: container
      FDB_COORDINATOR_PORT: 4500
    networks:
      - backend
    volumes:
      - fdb-data:/var/fdb/data
      - fdb-cluster-file:/var/fdb
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # one-shot: creates the database on first boot (no-op afterwards)
  foundationdb-init:
    image: foundationdb/foundationdb:7.3.63
    depends_on:
      - foundationdb
    entrypoint:
      - /bin/bash
      - -c
      - "sleep 5 && out=$(fdbcli -C /var/fdb/fdb.cluster --exec 'configure new single ssd' 2>&1); status=$$?; printf '%s\n' \"$$out\"; if [ \"$$status\" -eq 0 ]; then exit 0; fi; printf '%s\n' \"$$out\" | grep -Eiq 'already.*(configured|exists)|database.*configured'"
    volumes:
      - fdb-cluster-file:/var/fdb
    networks:
      - backend
    restart: "no"

networks:
  backend:
    driver: bridge

volumes:
  fdb-data:
  fdb-cluster-file:
