allowBuilds:
  "@mendable/firecrawl-rs": true
  "@scarf/scarf": false
  "@sentry-internal/node-cpu-profiler": true
  "@sentry/cli": true
  bigint-buffer: true
  bufferutil: true
  esbuild: true
  foundationdb: true
  four-flap-bigint-buffer: true
  keccak: true
  koffi: true
  libpq: true
  msgpackr-extract: true
  oxc-resolver: true
  protobufjs: true
  utf-8-validate: true
  wordpos: true
